<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 代码编辑中的安全漂移</title>
  <desc id="desc">功能缺陷被修复后，代码修改仍可能让安全风险在降低、残留和新增之间漂移</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.58" stop-color="#102843"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.56" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1310" cy="180" r="235" fill="#ef4444" opacity="0.08" filter="url(#glow)"/>
  <circle cx="260" cy="760" r="280" fill="#0ea5e9" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(115 110)">
    <rect x="0" y="0" width="174" height="42" rx="21" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="87" y="28" fill="#bae6fd" font-size="20" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-weight="700">AI × 安全测试</text>
    <text x="0" y="125" fill="#f8fafc" font-size="68" font-family="Microsoft YaHei, sans-serif" font-weight="800">Bug 修好了</text>
    <text x="0" y="211" fill="#f8fafc" font-size="68" font-family="Microsoft YaHei, sans-serif" font-weight="800">安全真的更好吗？</text>
    <text x="4" y="270" fill="#94a3b8" font-size="28" font-family="Microsoft YaHei, sans-serif">代码编辑中的 Security Drift</text>
  </g>

  <g transform="translate(132 500)">
    <rect x="0" y="0" width="330" height="190" rx="28" fill="#102f3d" stroke="#22c55e" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="58" cy="54" r="24" fill="#22c55e" fill-opacity="0.18" stroke="#4ade80"/>
    <path d="M47 54l8 8 16-19" fill="none" stroke="#86efac" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="62" fill="#dcfce7" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700">功能测试通过</text>
    <text x="34" y="121" fill="#94a3b8" font-size="22" font-family="Microsoft YaHei, sans-serif">原 Bug 已消失</text>
    <text x="34" y="158" fill="#94a3b8" font-size="22" font-family="Microsoft YaHei, sans-serif">回归用例全部变绿</text>

    <path d="M370 95H560" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
    <path d="M548 78l28 17-28 17" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="463" y="70" fill="#cbd5e1" font-size="20" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">AI 代码修改</text>

    <rect x="606" y="0" width="620" height="190" rx="28" fill="#391b2a" stroke="#fb7185" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M666 33l28 48h-56z" fill="#fb7185" fill-opacity="0.2" stroke="#fda4af" stroke-width="2"/>
    <path d="M666 49v15m0 8v2" stroke="#fecdd3" stroke-width="5" stroke-linecap="round"/>
    <text x="726" y="65" fill="#ffe4e6" font-size="30" font-family="Microsoft YaHei, sans-serif" font-weight="700">安全风险仍在漂移</text>
    <g font-family="Microsoft YaHei, sans-serif" font-size="22">
      <rect x="642" y="105" width="142" height="45" rx="22" fill="#22c55e" fill-opacity="0.15"/>
      <text x="713" y="135" fill="#86efac" text-anchor="middle">风险下降</text>
      <rect x="806" y="105" width="142" height="45" rx="22" fill="#f59e0b" fill-opacity="0.16"/>
      <text x="877" y="135" fill="#fcd34d" text-anchor="middle">风险残留</text>
      <rect x="970" y="105" width="218" height="45" rx="22" fill="#ef4444" fill-opacity="0.18"/>
      <text x="1079" y="135" fill="#fda4af" text-anchor="middle">新增 / 风险迁移</text>
    </g>
  </g>

  <text x="132" y="803" fill="#e2e8f0" font-size="28" font-family="Microsoft YaHei, sans-serif" font-weight="700">功能差异要测试，安全差异也要测试</text>
  <text x="132" y="844" fill="#64748b" font-size="21" font-family="Microsoft YaHei, sans-serif">Security Diff Gate · 基线 · 动态验证 · 人工复核</text>
</svg>
