<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Security Diff Gate 工作流</title>
  <desc id="desc">AI 修改代码后分别执行功能回归和安全差异检查，只有两条验证线都通过才允许合并</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="980" rx="34" fill="url(#bg)"/>
  <text x="110" y="92" fill="#0f172a" font-size="46" font-family="Microsoft YaHei, sans-serif" font-weight="800">Security Diff Gate</text>
  <text x="110" y="138" fill="#64748b" font-size="24" font-family="Microsoft YaHei, sans-serif">一次修改，两条验证线：功能正确 + 安全不退化</text>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="110" y="214" width="300" height="144" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="164" cy="266" r="24" fill="#dbeafe"/>
    <text x="164" y="274" fill="#1d4ed8" font-size="24" text-anchor="middle" font-weight="800">1</text>
    <text x="206" y="274" fill="#0f172a" font-size="27" font-weight="700">保存修改前基线</text>
    <text x="146" y="320" fill="#64748b" font-size="20">规则、版本、已知风险、测试语料</text>

    <rect x="650" y="214" width="300" height="144" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="704" cy="266" r="24" fill="#dbeafe"/>
    <text x="704" y="274" fill="#1d4ed8" font-size="24" text-anchor="middle" font-weight="800">2</text>
    <text x="746" y="274" fill="#0f172a" font-size="27" font-weight="700">AI 编辑代码</text>
    <text x="686" y="320" fill="#64748b" font-size="20">功能目标 + 可验证的安全不变量</text>

    <rect x="1190" y="214" width="300" height="144" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="1244" cy="266" r="24" fill="#dbeafe"/>
    <text x="1244" y="274" fill="#1d4ed8" font-size="24" text-anchor="middle" font-weight="800">3</text>
    <text x="1286" y="274" fill="#0f172a" font-size="27" font-weight="700">生成候选变更</text>
    <text x="1226" y="320" fill="#64748b" font-size="20">代码、依赖、配置和测试差异</text>
  </g>

  <path d="M430 286H625" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M970 286H1165" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <path d="M1340 378V438H800" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-slate)"/>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="150" y="484" width="570" height="250" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="198" y="548" fill="#166534" font-size="31" font-weight="800">功能验证线</text>
    <text x="198" y="598" fill="#334155" font-size="22">• 原 Bug 的复现用例由失败变为通过</text>
    <text x="198" y="640" fill="#334155" font-size="22">• 相关回归、边界与异常路径仍然通过</text>
    <text x="198" y="682" fill="#334155" font-size="22">• 测试没有被删除、放宽或绕过</text>

    <rect x="880" y="484" width="570" height="250" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="928" y="548" fill="#9a3412" font-size="31" font-weight="800">安全差异线</text>
    <text x="928" y="598" fill="#334155" font-size="22">• 同一规则比较修改前后的安全结果</text>
    <text x="928" y="640" fill="#334155" font-size="22">• 分开记录新增、残留、上升与迁移</text>
    <text x="928" y="682" fill="#334155" font-size="22">• 高风险数据流由人工完成复核</text>
  </g>

  <path d="M800 438V464H435V478" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-slate)"/>
  <path d="M800 438V464H1165V478" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-slate)"/>

  <path d="M435 750V804H760" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M1165 750V804H840" fill="none" stroke="#ea580c" stroke-width="5"/>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="535" y="804" width="530" height="112" rx="56" fill="#0f172a"/>
    <circle cx="607" cy="860" r="28" fill="#22c55e"/>
    <path d="M594 860l9 9 19-23" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="870" fill="#ffffff" font-size="30" font-weight="800">两条线都通过，才允许合并</text>
  </g>
</svg>
