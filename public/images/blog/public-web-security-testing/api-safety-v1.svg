<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">API 参数篡改与重放测试示意图</title><desc id="desc">客户端可以篡改请求或重复提交，后端必须重新计算、校验状态并保证幂等。</desc>
  <defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#2d73d5"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#d75b55"/></marker></defs>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17335d}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#52719a}.label{font-size:21px;font-weight:700}.small{font-size:16px}.white{fill:#fff;font-size:18px;font-weight:700}.red{fill:#b84b46;font-size:18px;font-weight:700}</style>
  <rect width="1200" height="675" rx="28" fill="#f5f9ff"/><text x="60" y="68" class="title">API 安全测试：参数被改、请求被重复，后端还能守住吗？</text><text x="60" y="102" class="sub">浏览器里的参数不可信；真正的规则必须由后端重新判断。</text>
  <rect x="70" y="185" width="255" height="285" rx="22" fill="#e7f0ff" stroke="#9dc3ff" stroke-width="2"/><text x="197" y="232" text-anchor="middle" class="label">客户端请求</text><rect x="100" y="265" width="195" height="58" rx="10" fill="#fff"/><text x="197" y="301" text-anchor="middle" class="small">价格：100 元</text><rect x="100" y="345" width="195" height="58" rx="10" fill="#fff0ee"/><text x="197" y="381" text-anchor="middle" class="red">被篡改：1 元</text><text x="197" y="438" text-anchor="middle" class="small">或把同一请求重复发送</text>
  <path d="M335 330 H475" stroke="#d75b55" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#red)"/><text x="405" y="305" text-anchor="middle" class="red">不可信输入</text>
  <rect x="490" y="190" width="250" height="280" rx="24" fill="#17335d"/><text x="615" y="240" text-anchor="middle" class="white">后端校验</text><text x="615" y="290" text-anchor="middle" class="white">重新计算金额</text><text x="615" y="332" text-anchor="middle" class="white">检查用户权限</text><text x="615" y="374" text-anchor="middle" class="white">检查当前状态</text><text x="615" y="416" text-anchor="middle" class="white">检查是否已处理</text>
  <path d="M750 330 H875" stroke="#2d73d5" stroke-width="5" marker-end="url(#blue)"/><rect x="895" y="185" width="235" height="285" rx="22" fill="#e7f0ff" stroke="#9dc3ff" stroke-width="2"/><text x="1012" y="232" text-anchor="middle" class="label">处理结果</text><rect x="925" y="268" width="175" height="55" rx="12" fill="#dff5e9"/><text x="1012" y="303" text-anchor="middle" class="label">合法：执行一次</text><rect x="925" y="350" width="175" height="55" rx="12" fill="#fff0ee"/><text x="1012" y="385" text-anchor="middle" class="red">异常：拒绝并记录</text>
  <rect x="70" y="545" width="1060" height="58" rx="14" fill="#dbeaff"/><text x="600" y="581" text-anchor="middle" class="label">测试重点：改价格、改状态、改对象 ID、重复提交、跳过前置步骤，后端都不能被绕过。</text>
</svg>
