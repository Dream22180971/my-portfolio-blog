<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">越权漏洞测试示意图</title><desc id="desc">用户只能访问自己的数据，普通用户不能访问管理员操作。测试应通过更换用户和对象进行验证。</desc>
  <defs><marker id="ok" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#2d73d5"/></marker><marker id="no" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#d75b55"/></marker></defs>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17335d}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#52719a}.h{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.white{fill:#fff;font-size:18px;font-weight:700}</style>
  <rect width="1200" height="675" rx="28" fill="#f5f9ff"/><text x="60" y="68" class="title">越权漏洞：为什么“前端隐藏按钮”不等于安全？</text><text x="60" y="102" class="sub">测试要直接验证接口：换一个用户、换一个对象 ID、换一个角色，结果仍必须正确。</text>
  <text x="290" y="165" text-anchor="middle" class="h">水平越权：A 不能访问 B 的数据</text><text x="900" y="165" text-anchor="middle" class="h">垂直越权：普通用户不能做管理员操作</text>
  <rect x="85" y="215" width="170" height="90" rx="16" fill="#e7f0ff"/><text x="170" y="255" text-anchor="middle" class="label">用户 A</text><text x="170" y="284" text-anchor="middle" class="small">自己的订单</text><rect x="325" y="215" width="170" height="90" rx="16" fill="#e7f0ff"/><text x="410" y="255" text-anchor="middle" class="label">用户 B</text><text x="410" y="284" text-anchor="middle" class="small">自己的订单</text>
  <path d="M255 260 H315" stroke="#2d73d5" stroke-width="5" marker-end="url(#ok)"/><text x="286" y="240" text-anchor="middle" class="small">仅本人数据</text><path d="M170 305 C170 410 410 410 410 305" fill="none" stroke="#d75b55" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#no)"/><circle cx="290" cy="393" r="25" fill="#d75b55"/><text x="290" y="401" text-anchor="middle" class="white">拒绝</text>
  <rect x="695" y="215" width="175" height="90" rx="16" fill="#e7f0ff"/><text x="782" y="255" text-anchor="middle" class="label">普通用户</text><text x="782" y="284" text-anchor="middle" class="small">查看自己的内容</text><rect x="940" y="215" width="175" height="90" rx="16" fill="#e7f0ff"/><text x="1027" y="255" text-anchor="middle" class="label">管理员操作</text><text x="1027" y="284" text-anchor="middle" class="small">删除、导出、配置</text>
  <path d="M870 260 H930" stroke="#d75b55" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#no)"/><circle cx="900" cy="230" r="25" fill="#d75b55"/><text x="900" y="238" text-anchor="middle" class="white">拒绝</text><rect x="695" y="365" width="420" height="120" rx="20" fill="#17335d"/><text x="905" y="410" text-anchor="middle" class="white">测试动作</text><text x="905" y="447" text-anchor="middle" class="white">换用户、换对象 ID、换角色后，请求应被后端拒绝</text>
  <rect x="60" y="570" width="1080" height="55" rx="14" fill="#dbeaff"/><text x="600" y="605" text-anchor="middle" class="label">正确做法：后端同时校验“你是谁” + “你是否有权操作这条数据”。</text>
</svg>
